<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0d1a">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/noam/noam.css">
  <title>Focus timer · Noam's Game Hub</title>
  <meta name="description" content="A Pomodoro focus timer: say what you'll work on, focus, take a break. Scores, streaks and calm music.">
  <style>
    .timer { text-align: center; padding: 28px 16px; }
    .ring { position: relative; width: min(280px, 70vw); aspect-ratio: 1; margin: 0 auto 18px; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 10; }
    .ring .bg { stroke: var(--surface-2); } .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s linear; }
    .ring.break .fg { stroke: var(--accent-2); }
    .ring .mid { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 4px; }
    .time { font-size: clamp(44px, 12vw, 64px); font-weight: 800; font-variant-numeric: tabular-nums; }
    .phase { color: var(--muted); font-weight: 700; font-size: 14px; }
    .task { font-size: 17px; font-weight: 700; margin: 0 0 16px; min-height: 22px; }
    .lens { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
    .lens button { padding: 8px 14px; border-radius: 10px; background: var(--surface-2); font-weight: 700; }
    .lens button.on { background: var(--accent); color: #fff; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
    .stats b { display: block; font-size: 26px; } .stats span { color: var(--muted); font-size: 13px; }
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin-top: 16px; }
    .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--muted); }
    .bars i { width: 100%; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 2px; }
    .hist { margin: 10px 0 0; padding: 0; list-style: none; } .hist li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; } .hist li:first-child { border-top: 0; } .hist .m { color: var(--muted); margin-left: auto; white-space: nowrap; }
    .stars button { font-size: 26px; padding: 0 4px; filter: grayscale(1); opacity: .5; } .stars button.on { filter: none; opacity: 1; }
  </style>
</head>
<body>
  <main class="page"><h1>🍅 Focus timer</h1><p class="lead">Say what you’ll work on, focus until the timer rings, then take a short break. Your sessions stay on this device.</p>
    <div class="card timer">
      <div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="fg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="mid"><div class="time" id="time">25:00</div><div class="phase" id="phase">Ready</div></div></div>
      <div id="setup"><input class="in" id="what" maxlength="120" placeholder="What will you work on?" style="max-width:420px;text-align:center"><div class="lens" id="lens"></div>
        <label class="check" style="justify-content:center"><input type="checkbox" id="music"> Play calm music while I focus</label>
        <button class="btn primary" id="start" style="min-width:200px">Start focusing</button></div>
      <div id="running" hidden><p class="task" id="tasktxt"></p><div class="row" style="justify-content:center"><button class="btn" id="pause">⏸ Pause</button><button class="btn ghost" id="stop">Stop</button><button class="btn ghost" id="skip" hidden>Skip break</button></div></div>
      <div id="rate" hidden><p class="task">How well did you focus?</p><div class="stars" id="stars"></div></div>
    </div>
    <div class="card"><h2>Your focus</h2><div class="stats"><div><b id="today">0</b><span>minutes today</span></div><div><b id="streak">0</b><span>day streak 🔥</span></div><div><b id="total">0</b><span>sessions</span></div></div><div class="bars" id="bars"></div></div>
    <div class="card"><h2>Recent sessions</h2><ul class="hist" id="hist"></ul></div>
  </main>
  <script src="/noam/noam-core.js"></script>
  <script src="/noam/glue.js"></script>
  <script src="/noam/ambient.js"></script>
  <script src="/noam/noam-ui.js"></script>
  <script>
    (() => {
    NoamUI.shell('focus'); hooks.init();
    const $ = (s) => document.querySelector(s);
    const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
    const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
    let prefs = load('focus-prefs', { len: 25, music: false });
    let sessions = load('focus-sessions', []);
    const LENS = [15, 25, 45, 60];
    let phase = 'ready', left = prefs.len * 60, total = left, endAt = 0, paused = false, tick = null, current = null;
    $('#lens').innerHTML = LENS.map((m) => `<button data-m="${m}">${m} min</button>`).join('');
    const paintLens = () => document.querySelectorAll('#lens button').forEach((b) => b.classList.toggle('on', +b.dataset.m === prefs.len));
    document.querySelectorAll('#lens button').forEach((b) => (b.onclick = () => { prefs.len = +b.dataset.m; store('focus-prefs', prefs); if (phase === 'ready') { left = total = prefs.len * 60; draw(); } paintLens(); }));
    $('#music').checked = !!prefs.music; $('#music').onchange = (e) => { prefs.music = e.target.checked; store('focus-prefs', prefs); };
    const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    function draw() {
      $('#time').textContent = fmt(left); $('#fg').style.strokeDashoffset = String(326.7 * (1 - left / total));
      $('#phase').textContent = phase === 'focus' ? (paused ? 'Paused' : 'Focusing') : phase === 'break' ? (paused ? 'Paused' : 'Break time ☕') : 'Ready';
      $('#ring').classList.toggle('break', phase === 'break');
      document.title = phase === 'ready' ? 'Focus timer · Noam\'s Game Hub' : `${fmt(left)} ${phase === 'break' ? '☕' : '🍅'} Focus`;
    }
    function chime() { try { const ac = new AudioContext(); [660, 880, 990].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0.0001, ac.currentTime + i * 0.25); g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + i * 0.25 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + i * 0.25 + 1.2); o.connect(g).connect(ac.destination); o.start(ac.currentTime + i * 0.25); o.stop(ac.currentTime + i * 0.25 + 1.3); }); } catch {} }
    function notify(t) { try { if ('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') new Notification(t, { icon: '/favicon.png' }); } catch {} }
    function run(p, secs) { phase = p; left = total = secs; endAt = Date.now() + secs * 1000; paused = false; clearInterval(tick); tick = setInterval(step, 250); draw(); $('#pause').textContent = '⏸ Pause'; $('#skip').hidden = p !== 'break'; $('#stop').hidden = p === 'break'; }
    function step() { if (paused) return; left = Math.max(0, (endAt - Date.now()) / 1000); draw(); if (left <= 0) done(); }
    function done() {
      clearInterval(tick); chime();
      if (phase === 'focus') {
        current.completed = true; current.minutes = Math.round(total / 60); finish();
        notify('🍅 Focus session done! Time for a break.');
        if (window.ambient && prefs.music) window.ambient.pause(4);
        $('#running').hidden = true; $('#rate').hidden = false;
        run('break', (total >= 45 * 60 ? 10 : 5) * 60);
      } else { notify('☕ Break over. Ready for another one?'); reset(); }
    }
    function finish() { sessions.unshift(current); sessions = sessions.slice(0, 500); store('focus-sessions', sessions); stats(); }
    function reset() { clearInterval(tick); phase = 'ready'; left = total = prefs.len * 60; draw(); $('#setup').hidden = false; $('#running').hidden = true; $('#rate').hidden = true; }
    $('#start').onclick = () => {
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
      current = { t: Date.now(), task: $('#what').value.trim(), planned: prefs.len, minutes: 0, completed: false };
      $('#tasktxt').textContent = current.task ? '🎯 ' + current.task : '🎯 Focusing';
      $('#setup').hidden = true; $('#running').hidden = false; $('#rate').hidden = true;
      if (prefs.music && window.ambient) { const st = window.ambient.state(); if (!Object.keys(st.levels || {}).some((k) => st.levels[k] > 0)) window.ambient.setLevel('piano', 0.8); window.ambient.play(); }
      run('focus', prefs.len * 60);
    };
    $('#pause').onclick = () => { if (!paused) { paused = true; left = Math.max(0, (endAt - Date.now()) / 1000); $('#pause').textContent = '▶ Resume'; } else { paused = false; endAt = Date.now() + left * 1000; $('#pause').textContent = '⏸ Pause'; } draw(); };
    $('#stop').onclick = () => { if (phase === 'focus' && current) { current.minutes = Math.round((total - left) / 60); if (current.minutes >= 1) finish(); } if (window.ambient && prefs.music) window.ambient.pause(2); reset(); };
    $('#skip').onclick = reset;
    $('#stars').innerHTML = [1, 2, 3, 4, 5].map((n) => `<button data-s="${n}" title="${n} of 5">⭐</button>`).join('');
    document.querySelectorAll('#stars button').forEach((b) => (b.onclick = () => { if (sessions[0]) { sessions[0].rating = +b.dataset.s; store('focus-sessions', sessions); } document.querySelectorAll('#stars button').forEach((x) => x.classList.toggle('on', +x.dataset.s <= +b.dataset.s)); setTimeout(() => { $('#rate').hidden = true; $('#running').hidden = false; stats(); }, 600); }));
    const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
    function stats() {
      const byDay = new Map(); for (const s of sessions) byDay.set(dayKey(s.t), (byDay.get(dayKey(s.t)) || 0) + (s.minutes || 0));
      $('#today').textContent = byDay.get(dayKey(Date.now())) || 0;
      let streak = 0; for (let d = new Date(); ; d.setDate(d.getDate() - 1)) { if ((byDay.get(dayKey(d)) || 0) > 0) streak++; else if (streak || dayKey(d) !== dayKey(Date.now())) break; }
      $('#streak').textContent = streak; $('#total').textContent = sessions.filter((s) => s.completed).length;
      const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push([d.toLocaleDateString([], { weekday: 'short' }), byDay.get(dayKey(d)) || 0]); }
      const max = Math.max(25, ...days.map((d) => d[1]));
      $('#bars').innerHTML = days.map(([l, m]) => `<div title="${m} min"><small>${m || ''}</small><i style="height:${(m / max) * 100}%"></i>${l}</div>`).join('');
      $('#hist').innerHTML = sessions.slice(0, 8).map((s) => `<li>${s.completed ? '✅' : '⏹'} <span>${esc(s.task || 'Focus session')}${s.rating ? ' · ' + '⭐'.repeat(s.rating) : ''}</span><span class="m">${s.minutes} min · ${new Date(s.t).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' })}</span></li>`).join('') || '<li class="muted">No sessions yet. Start your first one above!</li>';
    }
    paintLens(); draw(); stats();
    addEventListener('beforeunload', (e) => { if (phase === 'focus') { e.preventDefault(); e.returnValue = ''; } });
    })();
  </script>
</body>
</html>
