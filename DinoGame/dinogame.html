<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק הדינוזאור</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="dinogame.css">
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="text-center mb-4">
        <h1 class="text-3xl font-bold text-blue-600">דינוזאור וקקטוסים 🦖🌵</h1>
        <p class="text-gray-500 text-sm">הקקטוסים מעוצבים עכשיו בסגנון הפיקסלים המקורי!</p>
    </div>

    <div id="game-container" class="cursor-pointer">
        <div id="overlay" class="game-overlay">
            <div id="game-over-text" class="hidden text-center">
                <h2 class="text-4xl font-bold text-red-600 mb-2">נפסלת!</h2>
                <p id="final-score-display" class="text-xl"></p>
            </div>

            <button id="start-btn" class="bg-blue-500 text-white px-10 py-4 rounded-full text-2xl font-bold">
                שחק עכשיו
            </button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="absolute top-4 right-4 flex gap-4 score-panel">
            <div>
                HI <span id="high-score">00000</span>
            </div>
            <div>
                <span id="current-score">00000</span>
            </div>
        </div>
    </div>

    <div class="flex gap-8 mt-4 sm:hidden">
        <div id="mobile-jump" class="mobile-btn">⬆️</div>
        <div id="mobile-duck" class="mobile-btn">⬇️</div>
    </div>

    <!-- JS -->
    <script src="dinogame.js"></script>
</body>
</html>
