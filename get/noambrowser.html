<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Download NoamBrowser</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0d1a; --card: #171b36; --line: #2a3060; --text: #eef0ff; --muted: #9aa0c8; --accent: #7c5cff; --accent-2: #2ee6c9; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Inter, system-ui, sans-serif; color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
            background: radial-gradient(900px 480px at 15% -10%, rgba(124,92,255,.25), transparent 60%), radial-gradient(700px 400px at 110% 10%, rgba(46,230,201,.12), transparent 60%), var(--bg);
        }
        .box { width: min(560px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,.45); text-align: center; }
        .logo { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px; display: grid; place-items: center; font-size: 36px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
        h1 { font-size: 30px; font-weight: 800; margin-bottom: 6px; }
        .ver { color: var(--muted); font-size: 15px; margin-bottom: 22px; min-height: 20px; }
        .main { display: block; padding: 16px 20px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 800; font-size: 18px; text-decoration: none; box-shadow: 0 10px 28px rgba(124,92,255,.45); transition: transform .15s; }
        .main:hover { transform: translateY(-2px); }
        .main small { display: block; font-weight: 600; font-size: 13px; opacity: .85; margin-top: 3px; }
        h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 26px 0 10px; }
        .list { display: grid; gap: 8px; text-align: left; }
        .list a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #12152b; border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px; }
        .list a:hover { border-color: var(--accent); }
        .list a span { color: var(--muted); font-weight: 400; font-size: 13px; white-space: nowrap; }
        .feat { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
        .feat span { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
        .foot { margin-top: 22px; font-size: 13px; color: var(--muted); }
        .foot a { color: var(--accent-2); }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">🌐</div>
        <h1>NoamBrowser</h1>
        <div class="ver" id="ver">Finding the latest version…</div>
        <div class="feat"><span>🛡 Built-in ad blocker</span><span>🔒 VPN</span><span>🚫 No trackers</span></div>
        <a class="main" id="main" href="https://github.com/ntoder/NoamBrowser/releases/latest">⬇ Download<small id="mainSub">Latest version</small></a>
        <h2>All downloads</h2>
        <div class="list" id="list"><a href="https://github.com/ntoder/NoamBrowser/releases/latest">See every file on the release page <span>GitHub</span></a></div>
        <p class="foot">Already installed? NoamBrowser updates itself.<br><a href="/">← Back to Noam's Game Hub</a></p>
    </div>
    <script>
    (async () => {
        const OS = [
            { key: "win", name: "Windows (installer)", icon: "🪟", test: /setup.*\.exe$|\.msi$/i, rank: 0 },
            { key: "win", name: "Windows (portable, no install)", icon: "🪟", test: /\.exe$/i, rank: 1 },
            { key: "mac", name: "macOS (Apple chip M1/M2/M3)", icon: "🍎", test: /arm64.*\.(dmg|zip)$/i, rank: 2 },
            { key: "mac", name: "macOS (Intel)", icon: "🍎", test: /(x64|intel).*mac.*\.(dmg|zip)$|mac.*x64.*\.(dmg|zip)$/i, rank: 3 },
            { key: "mac", name: "macOS", icon: "🍎", test: /\.(dmg|pkg)$|mac.*\.zip$|darwin.*\.zip$/i, rank: 3 },
            { key: "linux", name: "Linux (.deb)", icon: "🐧", test: /\.deb$/i, rank: 4 },
            { key: "linux", name: "Linux (AppImage)", icon: "🐧", test: /\.appimage$/i, rank: 5 },
            { key: "linux", name: "Linux (.rpm)", icon: "🐧", test: /\.rpm$/i, rank: 6 }
        ];
        const ua = navigator.userAgent, mine = /Windows/i.test(ua) ? "win" : /Mac/i.test(ua) && !/iPhone|iPad/i.test(ua) ? "mac" : /Linux/i.test(ua) && !/Android/i.test(ua) ? "linux" : null;
        const size = (b) => (b > 1e6 ? (b / 1e6).toFixed(0) + " MB" : Math.round(b / 1e3) + " KB");
        try {
            const r = await fetch("https://api.github.com/repos/ntoder/NoamBrowser/releases/latest", { headers: { Accept: "application/vnd.github+json" } });
            if (!r.ok) throw new Error(r.status);
            const rel = await r.json();
            const files = rel.assets.filter((a) => !/\.(blockmap|yml|yaml|sha256|sig)$/i.test(a.name)).map((a) => ({ a, os: OS.find((o) => o.test.test(a.name)) })).filter((f) => f.os).sort((x, y) => x.os.rank - y.os.rank);
            document.getElementById("ver").textContent = `Version ${rel.tag_name.replace(/^v/i, "")} · ${new Date(rel.published_at).toLocaleDateString()}`;
            if (files.length) {
                document.getElementById("list").innerHTML = files.map((f) => `<a href="${f.a.browser_download_url}">${f.os.icon} ${f.os.name} <span>${f.a.name} · ${size(f.a.size)}</span></a>`).join("");
                const best = files.find((f) => f.os.key === mine);
                if (best) { const m = document.getElementById("main"); m.href = best.a.browser_download_url; m.firstChild.textContent = `⬇ Download for ${best.os.name.replace(/ \(.+\)/, "")}`; document.getElementById("mainSub").textContent = `${best.a.name} · ${size(best.a.size)}`; }
            }
        } catch (e) {
            document.getElementById("ver").textContent = "Latest version";
        }
    })();
    </script>
</body>
</html>
