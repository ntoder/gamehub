<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RX7DB1FEWY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RX7DB1FEWY');
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>סאבווי סרפרס - גרסת הדפדפן</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="subwaysurf.css">
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="score-box" id="score-display">ניקוד: 0</div>

        <div id="start-screen" class="overlay">
            <h1 class="text-5xl font-black mb-4 tracking-tighter">SUBWAY RUNNER</h1>
            <p class="text-xl">מוכנים לרוץ?</p>
            <button class="btn" onclick="startGame()">התחל משחק</button>
            <div class="mt-8 text-center text-sm opacity-70">
                <p>השתמש בחצים או החלק את האצבע כדי לזוז, לקפוץ ולהתכופף</p>
            </div>
        </div>

        <div id="game-over-screen" class="overlay" style="display: none;">
            <h2 class="text-6xl font-black mb-2 text-red-500">נפסלת!</h2>
            <p id="final-score" class="text-2xl mb-4"></p>
            <button class="btn" onclick="startGame()">נסה שוב</button>
        </div>
    </div>

    <!-- JS -->
    <script src="subwaysurf.js"></script>
</body>
</html>
