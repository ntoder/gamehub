<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #666 100%);
            border: 3px solid #333;
        }

        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            z-index: 10;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            gap: 40px;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            gap: 30px;
        }

        .game-title {
            font-size: 72px;
            font-weight: bold;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.7);
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-30px); }
        }

        .instructions {
            font-size: 20px;
            line-height: 2;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        button {
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #FFD93D 0%, #FFA500 100%);
            color: #333;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }

        .game-over-title {
            font-size: 60px;
            color: #FF6B6B;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.7);
        }

        .final-stats {
            font-size: 32px;
            color: #FFD93D;
            margin: 20px 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="game-title">SUBWAY SURFERS</div>
        <div class="instructions">
            <div>← → Arrow Keys / A D to Move</div>
            <div>↑ / W to Jump</div>
            <div>↓ / S to Slide</div>
            <div style="margin-top: 20px; font-size: 18px; color: #FFD93D;">
                Collect coins and avoid obstacles!
            </div>
        </div>
        <button onclick="startGame()">START GAME</button>
    </div>

    <div id="gameOverScreen">
        <div class="game-over-title">GAME OVER!</div>
        <div class="final-stats">Score: <span id="finalScore">0</span></div>
        <div class="final-stats">Coins: <span id="finalCoins">0</span></div>
        <button onclick="startGame()">PLAY AGAIN</button>
    </div>

    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>🪙 <span id="coins">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="subwaysurf.js"></script>
</body>
</html>
