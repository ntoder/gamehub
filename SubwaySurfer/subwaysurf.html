<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers</title>
    <link rel="stylesheet" href="subwaysurf.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>🪙 <span id="coins">0</span></div>
    </div>

    <div id="startScreen">
        <div class="game-title">SUBWAY<br>SURFERS</div>
        <div class="instructions">
            <div>← → Arrow Keys to Move Left/Right</div>
            <div>↑ Space to Jump</div>
            <div>↓ to Slide</div>
            <div style="margin-top: 30px; color: #FFD700; font-size: 16px;">
                Avoid obstacles and collect coins!
            </div>
        </div>
        <button onclick="startGame()">PLAY NOW</button>
    </div>

    <div id="gameOverScreen">
        <div class="game-over-title">GAME OVER!</div>
        <div class="final-stats">Score: <span id="finalScore">0</span></div>
        <div class="final-stats">Coins: <span id="finalCoins">0</span></div>
        <button onclick="startGame()">PLAY AGAIN</button>
    </div>

    <script src="subwaysurf.js"></script>
</body>
</html>
