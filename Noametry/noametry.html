<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noametry Dash</title>
    <link rel="stylesheet" href="noametry.css">
    <link rel="shortcut icon" href="noametry.png" type="image/x-icon">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Noametry Dash</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">Level:</span>
                    <span class="value" id="level">1</span>
                </div>
                <div class="stat">
                    <span class="label">Score:</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="label">Best:</span>
                    <span class="value" id="best">0</span>
                </div>
            </div>
        </div>

        <div class="game-board">
            <div class="player" id="player"></div>
            <div class="ground" id="ground"></div>
        </div>

        <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-content">
                <h2>Game Over!</h2>
                <p>Score: <span id="finalScore">0</span></p>
                <button id="restartBtn">Play Again</button>
            </div>
        </div>

        <div class="controls">
            <p>Click or press SPACE to jump</p>
        </div>
    </div>

    <script src="noametry.js"></script>
</body>
</html>
