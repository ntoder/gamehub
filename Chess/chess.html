<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="chess.css">
    <link rel="shortcut icon" href="chess.jpeg" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1>Chess</h1>
        <div class="info-panel">
            <div class="turn-info">
                <p>Current Turn: <span id="currentTurn">White</span></p>
                <p>Status: <span id="gameStatus">Game In Progress</span></p>
            </div>
            <div class="controls">
                <button id="resetBtn" onclick="resetGame()">New Game</button>
                <button id="undoBtn" onclick="undoMove()">Undo Last Move</button>
            </div>
        </div>
        <div class="board-container">
            <div id="chessboard" class="chessboard"></div>
        </div>
        <div class="move-history">
            <h3>Move History</h3>
            <div id="moveHistory" class="moves-list"></div>
        </div>
    </div>

    <script src="chess.js"></script>
</body>
</html>
