    <meta charset="UTF-8">
    <link rel="shortcut icon" href="pacman.jpeg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman Game</title>
    <link rel="stylesheet" href="pacman.css">
</head>
<body>
    <div class="container">
        <h1>Pacman Game</h1>
        <div class="info">
            <div class="score-board">
                <p>Score: <span id="score">0</span></p>
                <p>Lives: <span id="lives">3</span></p>
            </div>
            <button id="startBtn" class="start-btn">Start Game</button>
            <button id="pauseBtn" class="pause-btn">Pause</button>
        </div>
        <canvas id="gameCanvas" width="560" height="620"></canvas>
        <div class="controls">
            <p>Use Arrow Keys to move Pacman</p>
            <p id="gameStatus"></p>
        </div>
    </div>
    <script src="pacman.js"></script>
</body>
